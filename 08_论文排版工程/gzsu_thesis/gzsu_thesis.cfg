\ProvidesFile{gzsu_thesis.cfg}[2026/09/21 GZSU Thesis Template Config]

%% ========================================================================
%% 标题名称设置
%% ========================================================================
\ctexset{%
  chapter/name={第,章},
  appendixname=附录,
  contentsname={目~~录},
  listfigurename={图目录},
  listtablename={表目录},
  figurename=图,
  tablename=表,
  bibname=参考文献,
  indexname=索引,
}

%% ========================================================================
%% 日期格式
%% ========================================================================
% 中文日期格式
\def\CJK@todaysave\@today
\def\CJK@todaysmall@short{\the\year 年 \the\month 月}
\def\CJK@todaysmall{\the\year 年 \the\month 月 \the\day 日}
\def\CJK@today{\CJK@todaysmall}
\let\CJK@today\CJK@todaysmall

% 英文日期格式
\cdate{\the\year 年 \the\month 月}
\edate{\ifcase \month \or January\or February\or March\or April\or May%
       \or June\or July\or August\or September\or October\or November%
       \or December\fi\unskip,\ \the\year}

%% ========================================================================
%% 学校信息
%% ========================================================================
\def\gzsu@schoolname{广州体育学院}
\def\gzsu@eschoolname{Guangzhou Sport University}
\def\gzsu@thesisname{硕士学位论文}

%% ========================================================================
%% 关键词定义
%% ========================================================================
\def\gzsu@ckeywords@separator{，}
\def\gzsu@ekeywords@separator{, }

%% ========================================================================
%% 图表公式编号格式
%% ========================================================================
% 图序格式：第X章-X
\@ifundefined{thechapter}{}{%
  \renewcommand{\thefigure}{\thechapter-\arabic{figure}}
  \renewcommand{\thetable}{\thechapter-\arabic{table}}
  \renewcommand{\theequation}{\thechapter-\arabic{equation}}}

%% ========================================================================
%% 目录格式
%% ========================================================================
% 目录项间距
\def\@dotsep{1.5}
\def\@pnumwidth{2.5em}
\def\@tocrmarg{2.5em}

%% ========================================================================
%% 定理环境（可选）
%% ========================================================================
\theorembodyfont{\normalfont}
\theoremheaderfont{\normalfont\heiti}
{%
  \theorembodyfont{\normalfont}\theoremheaderfont{\normalfont\heiti}
  \theoremsymbol{\ensuremath{\square}}
  \theoremstyle{plain}
  \theoremseparator{：}
  \newtheorem{hypothesis}{假设}[chapter]
}

\endinput
